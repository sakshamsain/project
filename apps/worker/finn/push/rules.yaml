# Rules-first filing classifier, v1: calibrated on real NSE subject lines (8 Nov 2026
# samples in fixtures/nse/). Two passes: rules are tried on the exchange subject first;
# when the subject is generic ("General Updates", "Outcome of Board Meeting") or matches
# nothing, they are tried on the filing's own text. No match sends it to the small model.
#
# Order matters: the first matching rule wins. `any` holds case-insensitive regexes.

- id: trading_window
  category: unclassified
  attributes: {kind: trading_window}
  any: ['trading window']

- id: non_equity
  category: unclassified
  attributes: {kind: non_equity}
  any: ['declaration of nav', 'redemption/payment of interest', 'interest payment']

- id: auditor_resignation
  category: management_change
  attributes: {role: auditor, action: resign}
  any:
    - 'resignation of (the )?(joint )?(statutory )?auditors?'
    - 'auditors? ha(s|ve) resigned'

- id: results_intimation
  category: results
  attributes: {stage: intimation}
  any:
    - 'board meeting intimation'
    - 'intimation of (the )?board meeting'
    - 'notice of (the )?board meeting'
    - 'board meeting (is )?(scheduled|to be held)'
    - 'prior intimation'

- id: results_newspaper
  category: results
  attributes: {stage: newspaper_ad}
  any: ['newspaper (publication|advertisement|ad)s?.{0,100}(results|quarter|half year)']

- id: transcript
  category: earnings_call
  attributes: {stage: transcript}
  any: ['transcript']

- id: call_recording
  category: earnings_call
  attributes: {stage: recording}
  any: ['audio recording', 'video recording', 'recording of the (earnings|conference) call', 'audio/video']

- id: call_notice
  category: earnings_call
  attributes: {stage: notice}
  any:
    - '(earnings|conference) call (on|with|to discuss|scheduled)'
    - 'intimation of (earnings|conference) call'
    - 'earnings call'

- id: investor_meet
  category: investor_meetings
  any:
    - 'schedule of (analyst|investor|meet)'
    - 'analysts? or institutional investors? meet'
    - 'investor meet'
    - 'one[- ]on[- ]one meeting'
    - 'investor conference'
    - 'analyst\(s\)\s*/\s*investor\(s\) meet'
    - 'analysts?\s*/\s*institutional investor meet'

- id: results_presentation
  category: results
  attributes: {stage: presentation}
  any: ['investor presentation', 'earnings presentation', 'results presentation', 'shareholders?.? letter']

- id: results_filing
  category: results
  attributes: {stage: filing}
  any:
    - 'integrated filing.{0,20}financial'
    - 'financial results? for the (quarter|half[- ]year|year|period|nine months)'
    - '(un)?audited (standalone|consolidated)?\s*(and (standalone|consolidated)\s*)?financial results'
    - 'financial result updates'

- id: credit_rating
  category: credit_rating
  any:
    - 'credit rating'
    - 'rating (action|rationale|reaffirmed|upgrade|downgrade)'
    - '\b(crisil|icra|care ratings|india ratings|acuite|infomerics|brickwork)\b'

- id: kmp_change
  category: management_change
  any:
    - 'change in (directors?|key managerial personnel|kmp|management|senior management)'
    - '^appointment\b'
    - '^resignation\b'
    - '^cessation\b'
    - 'resignation of director'
    - 'appointment of (mr\.?|ms\.?|mrs\.?|dr\.? )?.{0,60}(chief|managing director|whole[- ]time|executive director|independent director|additional director|company secretary|compliance officer)'
    - 'resignation of (mr\.?|ms\.?|mrs\.?|dr\.? )?.{0,60}(chief|managing director|director|cfo|ceo|company secretary|compliance officer)'
    - 're-?appointment of'

- id: pledge
  category: pledging
  any: ['encumbrance', '\bpledge', 'regulation 31\s*\(1\)', 'reg\.? 31']

- id: insider
  category: insider_trading
  any:
    - 'insider trading'
    - 'regulation 7\s*\(2\)'
    - 'regulation 29\s*\(\d\)'
    - 'reg\.? 29'
    - '\bsast\b'
    - 'substantial acquisition'

- id: buyback
  category: fund_raise
  attributes: {kind: buyback}
  any: ['buy-?back']

- id: esop_allotment
  category: unclassified
  attributes: {kind: esop}
  any: ['\besop\b', '\besos\b', '\besps\b', 'employee stock option', 'employees? stock (purchase|option)']

- id: fund_use
  category: unclassified
  attributes: {kind: fund_use}
  any: ['monitoring agency', 'statement of deviation']

- id: fund_raise
  category: fund_raise
  any:
    - 'qualified institutions? placement'
    - '\bqip\b'
    - 'rights issue'
    - 'preferential (issue|allotment)'
    - 'commercial paper'
    - 'non[- ]convertible debentures'
    - '\bncds?\b'
    - '(raising|raise) of funds'
    - 'fund[- ]?raising'

- id: bonus_split
  category: bonus_split
  any: ['bonus (issue|shares)', 'sub-?division', 'stock split', 'split of (the )?(equity )?shares']

- id: dividend
  category: dividend
  any: ['\bdividend']

- id: m_and_a
  category: M&A
  any:
    - '\bacquisition\b'
    - 'amalgamation'
    - '\bmerger\b'
    - 'demerger'
    - 'scheme of arrangement'
    - 'joint venture'
    - 'investment in (a |its )?(wholly[- ]owned )?subsidiary'
    - 'stake (sale|purchase)'
    - 'divest'

- id: capex
  category: capex
  any:
    - 'capital expenditure'
    - '\bcapex\b'
    - 'capacity expansion'
    - 'new (plant|facility|manufacturing unit)'
    - 'commissioning of'
    - 'commercial production'

- id: litigation
  category: litigation
  any:
    - 'litigation'
    - 'show cause notice'
    - '\bpenalty\b'
    - 'orders? passed'
    - 'actions? (initiated|taken)'
    - 'insolvency'
    - '\bnclt\b'
    - 'tax demand'
    - 'warning letter'
    - 'search and seizure'
    - '\bcourt\b'
    - 'arbitra'
    - 'tribunal'

- id: disruption
  category: press_release
  attributes: {kind: disruption}
  any: ['disruption of operations', '\bfire\b', '\bstrike\b', 'shut ?down']

- id: order_win
  category: press_release
  attributes: {kind: order_win}
  any:
    - 'bagging/receiving of orders'
    - '(bags?|wins?|received|secures?) (an? )?(new )?(orders?|contracts?)'
    - 'order (win|inflow)'

- id: results_press_release
  # A release that reports the quarter's numbers belongs with the results it announces.
  category: results
  attributes: {stage: press_release}
  any:
    - '\b(reports?|announces?|posts?|delivers?|records?|achieves?)\b.{0,80}\b(results|performance|revenue|ebitda|pat|profits?|earnings)\b.{0,60}\b(q[1-4]|h[12]|9m|quarter|half[- ]year|fy\s?''?\d{2})'
    - '\b(q[1-4]|h[12]|9m)\s*-?\s*fy\s*''?\d{2}\b.{0,40}\b(results|performance)\b'
    - '\b(results|performance)\b.{0,40}\b(q[1-4]|h[12]|9m)\s*-?\s*fy\s*''?\d{2}\b'
    - '\b(pat|profits?|revenues?|ebitda|sales)\b.{0,60}\b(q[1-4]|h[12]|9m)\s*-?\s*fy\s*''?\d{2}\b'

- id: agm_egm
  category: agm_egm
  any: ['annual general meeting', '\bagm\b', 'extra-?ordinary general meeting', '\begm\b', 'shareholders meeting']

- id: postal_ballot
  category: postal_ballot
  any: ['postal ballot']

- id: routine
  category: unclassified
  any:
    - 'compliance certificate'
    - 'regulation 74\s*\(5\)'
    - '(loss|duplicate) (of )?share certificate'
    - 'investor complaints'
    - 'secretarial compliance'
    - 'business responsibility'
    - 'closure of (the )?register'
    - 'registrar and (share )?transfer agent'
    - 'newspaper (publication|advertisement)'
    - 'shareholding pattern'
    - 'record date'
    - 'registered office'

- id: press_release
  category: press_release
  confidence: 0.7
  any:
    - 'press release'
    - 'media release'
    - 'launch'
    - 'partnership'
    - 'clarification'
